<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Complete - Success</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Global Custom Styles -->
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="min-h-screen bg-base-300 flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-100 shadow-2xl border border-base-200">
        <div class="card-body items-center text-center p-8">
            <!-- Success Icon -->
            <div class="w-20 h-20 rounded-full bg-success/15 flex items-center justify-center mb-3 animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            
            <h1 class="card-title text-2xl font-bold text-base-content">Verification Successful!</h1>
            <p class="text-base-content/70 text-sm mt-2 leading-relaxed">
                Your captcha challenge and Discord authentication have been confirmed. Your access has been granted.
            </p>

            <div class="alert alert-success mt-4 text-sm flex justify-center py-3">
                <span><strong class="font-semibold">Verified:</strong> You may now return to Discord or return home.</span>
            </div>
            
            <div class="card-actions mt-6 w-full flex flex-col gap-2">
                <a href="/index.html" class="btn btn-primary w-full">Return Home</a>
                <button onclick="window.close()" class="btn btn-ghost btn-sm w-full text-base-content/60">Close Tab</button>
            </div>
            
            <div class="divider my-2"></div>
            
            <footer class="text-xs text-base-content/50">
                Powered by <span class="font-medium text-base-content/70">Wenlock2 Security</span>
            </footer>
        </div>
    </div>
</body>
</html>
